<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>parsgus — TikTok Metadata Analyzer</title>
  <style>
    :root {
      --bg-color: #0b0f12;
      --card-bg: #151a21;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #222933;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Header parsgus */
    header {
      width: 100%;
      max-width: 440px;
      padding: 24px 0 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-green);
      letter-spacing: -0.5px;
      text-transform: lowercase;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: #0b0f12;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-green);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent-green);
      color: #0b0f12;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--accent-green-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
      color: var(--accent-green);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .result {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .result h3 {
      font-size: 0.85rem;
      color: var(--accent-green);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 0.9rem;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row span {
      color: var(--text-muted);
    }

    .row strong {
      color: var(--text-main);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header Branding -->
  <header>
    <h1>parsgus</h1>
    <p>TikTok Metadata & Stream Analyzer</p>
  </header>

  <!-- Main Box -->
  <main class="container">
    <div class="card">
      <div class="input-group">
        <label for="url">TikTok Video URL</label>
        <input type="text" id="url" placeholder="https://vt.tiktok.com/xxxx/">
        <button onclick="getMetadata()">Ambil Statistik</button>
      </div>

      <div class="loading" id="loading">⚡ Mengambil data dari server...</div>

      <div class="result" id="resultCard">
        <h3>Statistik Video</h3>
        <div class="row"><span>Uploader</span> <strong id="uploader">-</strong></div>
        <div class="row"><span>Resolusi</span> <strong id="res">-</strong></div>
        <div class="row"><span>Frame Rate (FPS)</span> <strong id="fps">-</strong></div>
        <div class="row"><span>Durasi</span> <strong id="duration">-</strong></div>
        <div class="row"><span>Ukuran File</span> <strong id="filesize">-</strong></div>
        <div class="row"><span>Format</span> <strong id="format">-</strong></div>
      </div>
    </div>
  </main>

  <script>
    async function getMetadata() {
      const urlInput = document.getElementById('url').value.trim();
      if (!urlInput) {
        alert("Masukkan URL TikTok terlebih dahulu!");
        return;
      }

      const loading = document.getElementById('loading');
      const resultCard = document.getElementById('resultCard');

      loading.style.display = 'block';
      resultCard.style.display = 'none';

      try {
        const res = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: urlInput })
        });

        const data = await res.json();
        loading.style.display = 'none';

        if (data.error) {
          alert("Error: " + data.error);
          return;
        }

        document.getElementById('uploader').innerText = `${data.uploader} (@${data.username})`;
        document.getElementById('res').innerText = `${data.width} x ${data.height}`;
        document.getElementById('fps').innerText = `${data.fps} fps`;
        document.getElementById('duration').innerText = `${data.duration}s`;
        document.getElementById('filesize').innerText = `~${data.filesize_mb} MB`;
        document.getElementById('format').innerText = (data.ext || 'mp4').toUpperCase();

        resultCard.style.display = 'block';

      } catch (e) {
        loading.style.display = 'none';
        alert("Gagal terhubung ke API server.");
      }
    }
  </script>

</body>
</html>
